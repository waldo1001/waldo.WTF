# waldo.WTF — log rotation for the native server LaunchDaemon.
# Install: sudo cp deploy/newsyslog-waldo.conf /etc/newsyslog.d/com.waldo.wtf.conf
# Verify:  sudo newsyslog -nv
#
# Rotate at ~5 MB, keep 7 generations, gzip old ones.
# Caveat: launchd owns the stdout/stderr file descriptors, so a rotation fully
# takes effect on the next service (re)launch (a reboot or `launchctl kickstart -k`).
# Server log volume is low (a few lines per 5-min sync tick), so this is fine.
#
# logfilename                                  owner:group  mode count size  when  flags
/Users/waldo/waldo-wtf/logs/server.out.log     waldo:staff  644  7     5120  *     Z
/Users/waldo/waldo-wtf/logs/server.err.log     waldo:staff  644  7     5120  *     Z
